app-id: dev.aureon.desktop
runtime: org.kde.Platform
runtime-version: '6.5'
sdk: org.kde.Sdk
command: aureon-desktop
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
modules:
  - name: aureon
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: .
