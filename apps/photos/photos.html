<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREON Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF3FF;
  --bg-subtle: #F8FAFF;
  --surface: #FFFFFF;
  --surface-glass: rgba(255,255,255,0.85);
  --primary: #1677F8;
  --text-main: #17233D;
  --text-muted: #65738D;
  --border: #DCE5F5;
  --radius-sm: 8px;
  --radius-md: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; user-select: none; }
body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 220px; background: var(--surface-glass); backdrop-filter: blur(20px); border-right: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; }
.sidebar-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 4px 10px; margin-top: 10px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-main); }
.nav-item:hover { background: var(--bg-subtle); color: var(--primary); }
.nav-item.active { background: rgba(22,119,248,0.1); color: var(--primary); font-weight: 600; }

/* MAIN GALLERY */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.toolbar h2 { font-size: 16px; font-weight: 700; }
.gallery { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; align-content: flex-start; }
.photo-card { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); background: var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; transition: 0.2s; position: relative; height: 160px; }
.photo-card:hover { transform: scale(1.03); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.photo-card img, .photo-card svg { width: 100%; height: 100%; object-fit: cover; }

/* VIEWER MODAL */
.modal { position: fixed; inset: 0; background: rgba(14,21,37,0.85); backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 16px; }
.modal-img-wrap { max-width: 80%; max-height: 70%; display: flex; align-items: center; justify-content: center; }
.modal-img-wrap img, .modal-img-wrap svg { max-width: 100%; max-height: 100%; border-radius: var(--radius-md); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.controls-bar { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 30px; display: flex; gap: 16px; align-items: center; color: #fff; font-size: 12px; }
.controls-bar input { accent-color: var(--primary); }
.btn-close { position: absolute; top: 20px; right: 24px; background: rgba(255,255,255,0.2); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<div class="sidebar">
  <div style="display:flex; align-items:center; gap:10px; padding:8px;">
    <span style="font-size:24px;">🖼️</span>
    <span style="font-size:16px; font-weight:700;">Photos</span>
  </div>
  <div class="sidebar-title">Library</div>
  <div class="nav-item active"><span>🌄</span> All Photos</div>
  <div class="nav-item"><span>⭐</span> Favorites</div>
  <div class="nav-item"><span>🏔️</span> Landscapes</div>
  <div class="nav-item"><span>🌿</span> Nature</div>
  <div class="nav-item"><span>📸</span> Screenshots</div>
</div>

<div class="main">
  <div class="toolbar">
    <h2>All Photos (8 Items)</h2>
    <button style="background:var(--primary); color:#fff; border:none; padding:6px 14px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;" onclick="alert('Drag & drop photos anywhere to import.')">+ Import</button>
  </div>
  <div class="gallery" id="gallery"></div>
</div>

<div class="modal" id="viewer-modal">
  <button class="btn-close" onclick="closeModal()">✕</button>
  <div class="modal-img-wrap" id="modal-content"></div>
  <div class="controls-bar">
    <label>Brightness <input type="range" min="50" max="150" value="100" id="filter-bright" oninput="applyFilter()"></label>
    <label>Contrast <input type="range" min="50" max="150" value="100" id="filter-contrast" oninput="applyFilter()"></label>
    <button style="background:transparent; border:1px solid #fff; color:#fff; padding:4px 10px; border-radius:12px; cursor:pointer;" onclick="rotateImg()">⟳ Rotate</button>
  </div>
</div>

<script>
const photos = [
  { name: 'Mountain Lake Sunrise', src: '../../assets/wallpapers/mountain_lake_sunrise.svg' },
  { name: 'Abstract Blue Ribbons', src: '../../assets/wallpapers/abstract_blue_ribbons.svg' },
  { name: 'Alpine Dusk', src: '../../assets/wallpapers/nature_dusk.svg' },
  { name: 'Minimal Aura', src: '../../assets/wallpapers/minimal_gradient.svg' },
  { name: 'Aureon Geometric Brandmark', src: '../../assets/logos/aureon_logo.svg' }
];

let curRotation = 0;

function render() {
  const g = document.getElementById('gallery');
  g.innerHTML = '';
  photos.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `<img src="${p.src}" alt="${p.name}">`;
    card.onclick = () => openModal(p.src);
    g.appendChild(card);
  });
}

function openModal(src) {
  curRotation = 0;
  document.getElementById('modal-content').innerHTML = `<img id="pv-img" src="${src}">`;
  document.getElementById('viewer-modal').style.display = 'flex';
  applyFilter();
}

function closeModal() {
  document.getElementById('viewer-modal').style.display = 'none';
}

function rotateImg() {
  curRotation = (curRotation + 90) % 360;
  applyFilter();
}

function applyFilter() {
  const img = document.getElementById('pv-img');
  if (img) {
    const b = document.getElementById('filter-bright').value;
    const c = document.getElementById('filter-contrast').value;
    img.style.filter = `brightness(${b}%) contrast(${c}%)`;
    img.style.transform = `rotate(${curRotation}deg)`;
  }
}

render();
</script>
</body>
</html>
