<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREON OS — Boot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#000;
  font-family:'SF Pro Display','Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ===== STAGE CONTAINERS ===== */
#boot-screen {
  position:fixed; inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(ellipse 60% 60% at 50% 50%, #060f24 0%, #000 100%);
  z-index:100;
  opacity:1;
  transition:opacity 0.9s ease 0.2s;
}
#boot-screen.fade-out { opacity:0; pointer-events:none; }

/* ===== BACKGROUND PARTICLES ===== */
.particles {
  position:absolute; inset:0;
  overflow:hidden;
}
.particle {
  position:absolute;
  border-radius:50%;
  background:rgba(22,119,248,0.15);
  animation:floatParticle linear infinite;
}
@keyframes floatParticle {
  0% { transform:translateY(100vh) scale(0); opacity:0; }
  10% { opacity:1; }
  90% { opacity:1; }
  100% { transform:translateY(-20px) scale(1); opacity:0; }
}

/* ===== LOGO MARK ===== */
.boot-logo-wrap {
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}

.boot-logo-svg {
  width:120px;
  height:120px;
  opacity:0;
  animation:logoAppear 1.2s cubic-bezier(0.34,1.2,0.64,1) 0.4s forwards;
  filter:drop-shadow(0 0 40px rgba(22,119,248,0.7)) drop-shadow(0 0 80px rgba(169,155,255,0.3));
}

@keyframes logoAppear {
  0% { opacity:0; transform:scale(0.4) translateY(20px); }
  60% { opacity:1; transform:scale(1.08) translateY(-4px); }
  100% { opacity:1; transform:scale(1) translateY(0); }
}

/* Light sweep across logo */
.sweep-overlay {
  position:absolute;
  top:0; left:-100%; width:60%; height:100%;
  background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
  animation:sweep 1.8s ease-in-out 1.4s forwards;
  pointer-events:none;
  border-radius:50%;
}
@keyframes sweep {
  0% { left:-80%; opacity:1; }
  100% { left:120%; opacity:0.5; }
}

/* ===== WORDMARK ===== */
.boot-wordmark {
  font-size:48px;
  font-weight:900;
  letter-spacing:0.22em;
  color:#fff;
  opacity:0;
  animation:wordmarkAppear 0.9s ease 1.3s forwards;
  text-shadow:0 2px 32px rgba(22,119,248,0.6), 0 0 80px rgba(169,155,255,0.25);
  margin-top:24px;
}
@keyframes wordmarkAppear {
  0% { opacity:0; transform:translateY(16px) letterSpacing 0.5em; }
  100% { opacity:1; transform:translateY(0); }
}

/* ===== TAGLINE ===== */
.boot-tagline {
  font-size:14px;
  font-weight:400;
  letter-spacing:0.35em;
  color:rgba(255,255,255,0.55);
  text-transform:uppercase;
  opacity:0;
  animation:taglineAppear 0.8s ease 2.0s forwards;
  margin-top:12px;
}
@keyframes taglineAppear {
  0% { opacity:0; transform:translateY(10px); }
  100% { opacity:1; transform:translateY(0); }
}

/* ===== RING ANIMATION ===== */
.ring-container {
  position:absolute;
  width:200px;
  height:200px;
  pointer-events:none;
  opacity:0;
  animation:ringsAppear 1s ease 0.5s forwards;
}
@keyframes ringsAppear {
  0% { opacity:0; }
  100% { opacity:1; }
}

.ring {
  position:absolute;
  border-radius:50%;
  border:1px solid;
  left:50%; top:50%;
  transform:translate(-50%,-50%) scale(0);
  animation:ringExpand 2.5s ease-out infinite;
}
.ring:nth-child(1) { width:160px;height:160px;border-color:rgba(22,119,248,0.3);animation-delay:0.4s; }
.ring:nth-child(2) { width:220px;height:220px;border-color:rgba(169,155,255,0.2);animation-delay:0.9s; }
.ring:nth-child(3) { width:290px;height:290px;border-color:rgba(22,119,248,0.1);animation-delay:1.4s; }

@keyframes ringExpand {
  0% { transform:translate(-50%,-50%) scale(0); opacity:0.8; }
  100% { transform:translate(-50%,-50%) scale(1); opacity:0; }
}

/* ===== PROGRESS BAR ===== */
.boot-progress-wrap {
  margin-top:56px;
  width:220px;
  opacity:0;
  animation:progAppear 0.6s ease 2.2s forwards;
}
@keyframes progAppear {
  0% { opacity:0; }
  100% { opacity:1; }
}

.boot-progress-track {
  width:100%;
  height:3px;
  background:rgba(255,255,255,0.1);
  border-radius:2px;
  overflow:hidden;
}

.boot-progress-bar {
  height:100%;
  width:0%;
  background:linear-gradient(90deg, #1677F8, #A99BFF, #238BFF);
  border-radius:2px;
  animation:progressFill 2.8s cubic-bezier(0.4,0,0.2,1) 2.4s forwards;
  box-shadow:0 0 10px rgba(22,119,248,0.6);
}
@keyframes progressFill {
  0% { width:0%; }
  20% { width:18%; }
  40% { width:35%; }
  60% { width:60%; }
  80% { width:82%; }
  100% { width:100%; }
}

.boot-progress-label {
  text-align:center;
  margin-top:12px;
  font-size:11px;
  letter-spacing:0.12em;
  color:rgba(255,255,255,0.3);
  font-weight:400;
  animation:statusCycle 2.8s step-end 2.4s;
}

/* ===== BOOT STATUS DOTS ===== */
.boot-dots {
  display:flex;
  gap:8px;
  margin-top:28px;
  opacity:0;
  animation:dotsAppear 0.5s ease 2.1s forwards;
}
@keyframes dotsAppear {
  0%{opacity:0;} 100%{opacity:1;}
}
.boot-dot {
  width:6px; height:6px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  animation:dotPulse 0.9s ease-in-out infinite;
}
.boot-dot:nth-child(2) { animation-delay:0.2s; }
.boot-dot:nth-child(3) { animation-delay:0.4s; }
@keyframes dotPulse {
  0%,100% { background:rgba(255,255,255,0.15); transform:scale(1); }
  50% { background:rgba(22,119,248,0.9); transform:scale(1.3); }
}

/* ===== VERSION ===== */
.boot-version {
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:rgba(255,255,255,0.2);
  letter-spacing:0.1em;
  opacity:0;
  animation:versionAppear 0.6s ease 2.3s forwards;
}
@keyframes versionAppear {
  0%{opacity:0;} 100%{opacity:1;}
}
</style>
</head>
<body>

<div id="boot-screen">
  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Rings -->
  <div class="ring-container">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>

  <div class="boot-logo-wrap">
    <!-- Logo SVG -->
    <svg class="boot-logo-svg" viewBox="0 0 120 120" fill="none">
      <defs>
        <linearGradient id="bLogoG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1677F8"/>
          <stop offset="50%" stop-color="#8175EE"/>
          <stop offset="100%" stop-color="#A99BFF"/>
        </linearGradient>
        <filter id="bGlow">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M60 10 L100 95 H78 L60 58 L42 95 H20 Z" fill="url(#bLogoG)" filter="url(#bGlow)"/>
      <path d="M36 76 H84" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <circle cx="60" cy="10" r="5" fill="white" opacity="0.5"/>
    </svg>

    <!-- Light sweep effect -->
    <div class="sweep-overlay"></div>
  </div>

  <div class="boot-wordmark">AUREON</div>
  <div class="boot-tagline">Dream. Create. Explore.</div>

  <div class="boot-dots">
    <div class="boot-dot"></div>
    <div class="boot-dot"></div>
    <div class="boot-dot"></div>
  </div>

  <div class="boot-progress-wrap">
    <div class="boot-progress-track">
      <div class="boot-progress-bar"></div>
    </div>
    <div class="boot-progress-label" id="boot-status">Starting AUREON OS…</div>
  </div>

  <div class="boot-version">AUREON OS v1.0 · Build 2026.11.16</div>
</div>

<script>
// Generate floating particles
(function() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*8+6}s;
      animation-delay:${Math.random()*6}s;
      opacity:${Math.random()*0.6+0.1};
    `;
    container.appendChild(p);
  }
})();

// Status messages
const statuses = [
  'Starting AUREON OS…',
  'Loading kernel modules…',
  'Initializing hardware…',
  'Starting services…',
  'Loading desktop environment…',
  'Welcome to AUREON OS'
];

let si = 0;
const statusEl = document.getElementById('boot-status');
const statusInterval = setInterval(() => {
  si++;
  if (si < statuses.length) {
    statusEl.textContent = statuses[si];
  } else {
    clearInterval(statusInterval);
  }
}, 450);

// Transition to login after boot
setTimeout(() => {
  document.getElementById('boot-screen').classList.add('fade-out');
  setTimeout(() => {
    window.location.href = 'login.html';
  }, 1200);
}, 6500);

// Skip boot on click or keypress
function skipBoot() {
  document.getElementById('boot-screen').classList.add('fade-out');
  setTimeout(() => { window.location.href = 'login.html'; }, 300);
}
document.addEventListener('click', skipBoot);
document.addEventListener('keydown', skipBoot);
</script>
</body>
</html>
