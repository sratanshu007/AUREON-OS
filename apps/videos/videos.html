<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREON Videos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E1525;
  --surface: #18233C;
  --surface-glass: rgba(24,35,60,0.85);
  --primary: #1677F8;
  --text-main: #F0F4FC;
  --text-muted: #8E9CB2;
  --border: #263554;
  --radius-sm: 8px;
  --radius-md: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; user-select: none; }
body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* HEADER */
.header { height: 48px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.header h2 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* LAYOUT */
.layout { flex: 1; display: grid; grid-template-columns: 1fr 280px; overflow: hidden; }

/* VIDEO PLAYER WRAP */
.player-wrap { display: flex; flex-direction: column; background: #000; position: relative; }
.video-canvas-box { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
canvas { width: 100%; height: 100%; object-fit: contain; }

/* CONTROLS OVERLAY */
.controls {
  height: 60px; background: rgba(14,21,37,0.85); backdrop-filter: blur(16px); display: flex;
  align-items: center; justify-content: space-between; padding: 0 20px; gap: 16px; border-top: 1px solid var(--border);
}
.btn-ctl { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; }
.progress-bar { flex: 1; accent-color: var(--primary); }

/* SIDEBAR PLAYLIST */
.sidebar { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sidebar-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.clip-card {
  display: flex; gap: 12px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer; transition: 0.15s;
  border: 1px solid transparent; background: rgba(255,255,255,0.03);
}
.clip-card:hover { background: rgba(22,119,248,0.12); border-color: var(--primary); }
.clip-card.active { background: rgba(22,119,248,0.2); border-color: var(--primary); }
.clip-thumb { width: 80px; height: 50px; border-radius: 4px; background: #0E1525; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.clip-info { display: flex; flex-direction: column; gap: 4px; }
.clip-name { font-size: 12px; font-weight: 600; line-height: 1.3; }
.clip-dur { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="header">
  <h2><span>🎬</span> AUREON Video Player</h2>
  <span style="font-size:12px; color:var(--text-muted);">4K HDR Cinema Engine</span>
</div>

<div class="layout">
  <div class="player-wrap">
    <div class="video-canvas-box">
      <canvas id="video-canvas"></canvas>
    </div>
    <div class="controls">
      <button class="btn-ctl" id="btn-play" onclick="togglePlay()">▶</button>
      <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0" oninput="seek(this.value)">
      <span style="font-size:11px; color:var(--text-muted);" id="time-display">0:00 / 2:30</span>
      <button class="btn-ctl" onclick="alert('Full screen mode activated.')">⛶</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">Recent Videos</div>
    <div class="clip-card active" onclick="loadClip('Sunrise Over Alpine Lake', '4K UHD')">
      <div class="clip-thumb">🌄</div>
      <div class="clip-info">
        <div class="clip-name">Sunrise Over Alpine Lake</div>
        <div class="clip-dur">4K UHD • 2:30</div>
      </div>
    </div>
    <div class="clip-card" onclick="loadClip('Aureon Keynote 2026', '1080p')">
      <div class="clip-thumb">✨</div>
      <div class="clip-info">
        <div class="clip-name">Aureon Keynote 2026</div>
        <div class="clip-dur">1080p • 18:45</div>
      </div>
    </div>
    <div class="clip-card" onclick="loadClip('Quantum AI Visualization', '60 FPS')">
      <div class="clip-thumb">⚡</div>
      <div class="clip-info">
        <div class="clip-name">Quantum AI Visualization</div>
        <div class="clip-dur">60 FPS • 4:12</div>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('video-canvas');
const ctx = canvas.getContext('2d');
let isPlaying = false;
let animFrame = null;
let t = 0;

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.onresize = resize;
resize();

function drawFrame() {
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // Render animated glowing ribbons / particles
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.strokeStyle = i % 2 === 0 ? '#1677F8' : '#8175EE';
    ctx.lineWidth = 4;
    const r = 80 + i * 35;
    ctx.arc(cx, cy, r, t + i * 0.5, t + i * 0.5 + Math.PI * 1.2);
    ctx.stroke();
  }

  // Center logo
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 24px Inter';
  ctx.textAlign = 'center';
  ctx.fillText('AUREON CINEMA', cx, cy + 8);

  if (isPlaying) {
    t += 0.03;
    let p = (t * 5) % 100;
    document.getElementById('progress').value = p;
    animFrame = requestAnimationFrame(drawFrame);
  }
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('btn-play').innerText = isPlaying ? '⏸' : '▶';
  if (isPlaying) drawFrame();
}

function loadClip(name, badge) {
  document.querySelectorAll('.clip-card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
  t = 0;
  if (!isPlaying) togglePlay();
}

drawFrame();
</script>
</body>
</html>
